services:
  topol:
    build: .
    container_name: topol-engine
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      # SAFE BY DEFAULT: writes are simulated only. Set to 0 for production writes.
      - TOPOL_DRY_RUN=1
      # Circuit breaker: max sheet writes per cycle before the cycle aborts.
      - TOPOL_MAX_WRITES=50
      # Scan only the last N rows per tab (speed + old rows are never touched).
      - TOPOL_SCAN_ROWS=30
      # Main sync cycle cadence (min) and hourly backfill of missing rows.
      - TOPOL_INTERVAL_MINUTES=10
      - TOPOL_BACKFILL_MINUTES=60
      # Max rows backfill adds per run (rest drains over the next runs).
      - TOPOL_BACKFILL_MAX=200
    volumes:
      - ./service_account.json:/app/service_account.json:ro
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    build: .
    container_name: topol-ui
    restart: unless-stopped
    command: python3 -u ui.py
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./service_account.json:/app/service_account.json:ro
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:18889:18889"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: topol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: topol
      POSTGRES_USER: topol
      POSTGRES_PASSWORD: Topol2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
